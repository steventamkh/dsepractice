<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DSE Physics MC Practice</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2315803d'/%3E%3Ctext x='32' y='43' font-size='30' text-anchor='middle' fill='white' font-family='Arial' font-weight='bold'%3EMC%3C/text%3E%3C/svg%3E">
<style>
  :root{--bg:#f5f6f8;--panel:#fff;--ink:#1b2430;--muted:#5d6b7a;--line:#dde2e8;--accent:#15803d;--accent-soft:#dcfce7;
    --good:#1a7f37;--good-soft:#dafbe1;--bad:#cf222e;--bad-soft:#ffebe9;--warn:#9a6700;--chip:#eef1f4;
    --shadow:0 1px 2px rgba(16,24,40,.05),0 6px 18px rgba(16,24,40,.06)}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Microsoft JhengHei","PingFang TC",sans-serif;line-height:1.5}
  .wrap{max-width:900px;margin:0 auto;padding:24px 14px 60px}
  header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
  h1{font-size:clamp(1.4rem,4vw,1.9rem);margin:0;letter-spacing:-.01em}
  .sub{color:var(--muted);margin:2px 0 0;font-size:.95rem}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:var(--shadow);margin-top:18px}
  .card h2{font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 10px}
  .row{margin-bottom:18px}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:999px;padding:7px 14px;font:inherit;font-size:.95rem;cursor:pointer;user-select:none}
  .chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
  .hint{color:var(--muted);font-size:.85rem;margin-top:6px}
  .btn{font:inherit;border:0;border-radius:12px;padding:11px 20px;background:var(--accent);color:#fff;font-weight:600;cursor:pointer}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
  .btn.small{padding:7px 12px;font-size:.9rem}
  .count{font-weight:600;color:var(--accent)}
  .langsw{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .langsw button{font:inherit;border:0;background:var(--panel);padding:6px 12px;cursor:pointer;color:var(--muted)}
  .langsw button.on{background:var(--accent);color:#fff}
  /* quiz */
  .qbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:.92rem;color:var(--muted)}
  .prog{height:6px;background:var(--chip);border-radius:9px;overflow:hidden;margin:10px 0 0}
  .prog i{display:block;height:100%;background:var(--accent);transition:width .2s}
  .tag{display:inline-block;background:var(--accent-soft);color:var(--accent);border-radius:6px;padding:1px 8px;font-size:.8rem;font-weight:600;margin-right:6px}
  .tag.ext{background:#fff4d6;color:var(--warn)}
  .qimg{width:100%;height:auto;display:block;border-radius:8px;margin:14px 0;background:#fff}
  .opts{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .opt{font:inherit;font-size:1.25rem;font-weight:700;padding:14px 0;border-radius:12px;border:2px solid var(--line);background:var(--panel);cursor:pointer;color:var(--ink)}
  .opt.sel{border-color:var(--accent);background:var(--accent);color:#fff}
  .opt.right{border-color:var(--good);background:var(--good-soft);color:var(--good)}
  .opt.wrong{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
  .feedback{margin-top:12px;padding:10px 14px;border-radius:10px;font-weight:600}
  .feedback.ok{background:var(--good-soft);color:var(--good)}
  .feedback.no{background:var(--bad-soft);color:var(--bad)}
  .nav{display:flex;justify-content:space-between;gap:10px;margin-top:16px;flex-wrap:wrap}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;color:var(--ink)}
  .timer.low{color:var(--bad)}
  .dots{display:flex;flex-wrap:wrap;gap:5px;margin-top:14px}
  .dot{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--panel);font-size:.78rem;cursor:pointer;color:var(--muted)}
  .dot.ans{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
  .dot.cur{outline:2px solid var(--accent);outline-offset:1px}
  #flagBtn.on{border-color:var(--warn);color:var(--warn);font-weight:700}
  .dot.flag{border-color:var(--warn);border-width:2px}
  /* results */
  .big{font-size:2.6rem;font-weight:800;margin:0}
  table{width:100%;border-collapse:collapse;font-size:.93rem}
  th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
  th{color:var(--muted);font-weight:600;font-size:.8rem;text-transform:uppercase;letter-spacing:.05em}
  .bar{height:8px;background:var(--chip);border-radius:9px;overflow:hidden;min-width:60px}
  .bar i{display:block;height:100%;background:var(--accent)}
  .ok{color:var(--good);font-weight:700}.no{color:var(--bad);font-weight:700}
  .rev{border-top:1px solid var(--line);padding-top:14px;margin-top:14px}
  footer{color:var(--muted);font-size:.8rem;margin-top:30px;text-align:center}
  .acct{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--muted);flex-wrap:wrap;justify-content:flex-end}
  .acct b{color:var(--ink);font-weight:600}
  .acct .st.ok{color:var(--good)}.acct .st.err{color:var(--bad)}
  .gate{text-align:center;padding:36px 20px}
  .gate h2{font-size:1.3rem;text-transform:none;letter-spacing:0;color:var(--ink);margin:0 0 8px}
  .gate p{color:var(--muted);margin:0 auto 18px;max-width:460px}
  .gate .gbtn{display:flex;justify-content:center;min-height:44px}
  .gate .err{color:var(--bad);font-weight:600;margin-top:12px}
  .hidden{display:none!important}
  @media(max-width:520px){.opt{font-size:1.1rem;padding:12px 0}.card{padding:14px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1 data-t="title"></h1>
      <p class="sub" data-t="subtitle"></p>
    </div>
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:flex-end">
    <div class="acct" id="acct"></div>
    <button class="btn ghost small hidden" id="homeBtn" onclick="goHome()" style="background:var(--panel)"></button>
    <div class="langsw" role="group" aria-label="Language">
      <button id="lgE" onclick="setLang('E')">English</button>
      <button id="lgC" onclick="setLang('C')">中文</button>
    </div>
    </div>
  </header>

  <!-- SIGN-IN GATE -->
  <section id="gate">
    <div class="card gate">
      <h2 data-t="gateH"></h2>
      <p data-t="gateP"></p>
      <div class="gbtn" id="gsiBtn"></div>
      <div class="err hidden" id="gateErr"></div>
    </div>
  </section>

  <!-- SETUP -->
  <section id="setup" class="hidden">
    <div class="card">
      <div class="row">
        <h2 data-t="paperH"></h2>
        <div class="chips" id="paperChips"></div>
      </div>
      <div class="row">
        <h2 data-t="years"></h2>
        <div class="chips" id="yearChips"></div>
        <div style="margin-top:8px;display:flex;gap:8px"><button class="btn ghost small" onclick="setAll('yearChips',true)" data-t="selAll"></button><button class="btn ghost small" onclick="setAll('yearChips',false)" data-t="selNone"></button></div>
      </div>
      <div class="row">
        <h2 data-t="topics"></h2>
        <div class="chips" id="topicChips"></div>
      </div>
      <div class="row" id="extRow">
        <h2 data-t="ext"></h2>
        <div class="chips">
          <button class="chip" id="extChip" aria-pressed="true" onclick="toggle(this);refresh()"></button>
        </div>
        <div class="hint" data-t="extHint"></div>
      </div>
      <div class="row">
        <h2 data-t="howMany"></h2>
        <div class="chips" id="numChips"></div>
      </div>
      <div class="row">
        <h2 data-t="order"></h2>
        <div class="chips" id="orderChips"></div>
      </div>
      <div class="row">
        <h2 data-t="mode"></h2>
        <div class="chips" id="modeChips"></div>
        <div class="hint" id="modeHint"></div>
      </div>
      <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap">
        <button class="btn" id="startBtn" onclick="start()"></button>
        <span id="poolInfo" class="hint" style="margin:0"></span>
      </div>
    </div>
    <div class="card" id="wrongCard">
      <h2 data-t="myWrong"></h2>
      <p id="wrongInfo" style="margin:0 0 10px"></p>
      <button class="btn ghost small" id="wrongBtn" onclick="startWrong()"></button>
      <button class="btn ghost small" onclick="clearWrong()" data-t="clear"></button>
    </div>
    <div class="card" id="flagCard">
      <h2 data-t="myFlag"></h2>
      <p id="flagInfo" style="margin:0 0 10px"></p>
      <button class="btn ghost small" id="flagStartBtn" onclick="startFlag()"></button>
      <button class="btn ghost small" id="flagListBtn" onclick="showFlagList()"></button>
      <button class="btn ghost small" onclick="clearFlag()" data-t="clear"></button>
      <div id="flagList" class="hidden" style="margin-top:12px"></div>
    </div>
  </section>

  <!-- QUIZ -->
  <section id="quiz" class="hidden">
    <div class="card">
      <div class="qbar">
        <div><span id="qPos"></span> &nbsp; <span id="qTags"></span></div>
        <div id="timerBox" class="hidden">⏱ <span class="timer" id="timer"></span></div>
      </div>
      <div class="prog"><i id="progBar"></i></div>
      <a id="qLink" target="_blank" rel="noopener"><img class="qimg" id="qImg" alt=""></a>
      <div class="hint" style="margin-top:-8px;text-align:right" data-t="zoom"></div>
      <div class="opts" id="opts"></div>
      <div id="fb" class="feedback hidden"></div>
      <div class="nav">
        <div style="display:flex;gap:8px">
          <button class="btn ghost small" id="prevBtn" onclick="go(-1)"></button>
          <button class="btn ghost small" id="flagBtn" onclick="flag()"></button>
        </div>
        <div style="display:flex;gap:8px">
          <button class="btn ghost small" onclick="quit()" data-t="quit"></button>
          <button class="btn small" id="nextBtn" onclick="go(1)"></button>
        </div>
      </div>
      <div class="dots" id="dots"></div>
    </div>
  </section>

  <!-- RESULTS -->
  <section id="results" class="hidden">
    <div class="card">
      <h2 data-t="result"></h2>
      <p class="big" id="score"></p>
      <p class="sub" id="scoreSub"></p>
      <table style="margin-top:14px">
        <thead><tr><th data-t="topic"></th><th data-t="correct"></th><th></th></tr></thead>
        <tbody id="topicTable"></tbody>
      </table>
      <p class="hint" id="saveInfo"></p>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:18px">
        <button class="btn" onclick="showSetup()" data-t="newSet"></button>
        <button class="btn ghost" id="redoBtn" onclick="redoWrong()"></button>
      </div>
    </div>
    <div class="card">
      <h2 data-t="review"></h2>
      <div class="chips" style="margin-bottom:6px">
        <button class="chip" id="onlyWrongChip" aria-pressed="true" onclick="toggle(this);renderReview()"></button>
      </div>
      <div id="reviewList"></div>
    </div>
  </section>

  <footer data-t="footer"></footer>
</div>

<script>
const T = {
  E:{title:"DSE Physics MC Practice",subtitle:"HKDSE past-paper MC questions — Paper 1A (2012–2025) and Paper 2 electives (2012–2025) — choose by year or topic",
     years:"Year",topics:"Topic",ext:"Extension questions (*)",extOn:"Include * questions",extHint:"Questions marked * involve the extension component (not for Category A students).",
     howMany:"Number of questions",all:"All",order:"Order",random:"Random",paper:"Paper order",mode:"Mode",
     practice:"Practice",exam:"Exam",practiceHint:"See the answer straight after each question.",examHint:"Timed (1.8 min per question, like the real exam). Answers shown at the end.",
     start:"Start",pool:n=>`${n} question(s) match your choices`,myWrong:"My wrong questions",
     wrongInfo:n=>n?`You have ${n} question(s) you answered wrongly before (saved to your account).`:"No wrong questions saved yet.",
     redoSaved:"Practise these",clear:"Clear",prev:"← Prev",next:"Next →",finish:"Finish",flag:"⚐ Flag",unflag:"⚑ Flagged",myFlag:"⚑ My flagged questions",flagInfo:n=>n?`You have flagged ${n} question(s) to review later (saved to your account).`:"No flagged questions yet. Press “⚐ Flag” while doing a question to save it here.",flagStart:"Practise these",flagList:"Show list",flagHide:"Hide list",unflagQ:"Remove",flagRedo:"Flagged review – ",quit:"Quit",
     q:(i,n)=>`Question ${i} of ${n}`,correctFb:"✓ Correct!",wrongFb:k=>`✗ The answer is ${k}.`,pct:p=>` (${p}% of DSE candidates got this right)`,
     confirmFinish:n=>`${n} question(s) not answered. Finish anyway?`,confirmQuit:"Quit this set? Your answers will be lost.",
     result:"Result",scoreSub:(c,n,t)=>`${c} out of ${n} correct${t?` · time used ${t}`:""}`,topic:"Topic",correct:"Correct",
     newSet:"New set",redo:n=>`Redo ${n} wrong`,review:"Review",onlyWrong:"Show wrong / unanswered only",
     yours:"Your answer",key:"Answer",none:"—",paperQ:q=>q.P===2?`${q.y} DSE Paper 2 Q${q.q}`:`${q.y} DSE Q${q.n}`,
     footer:"For internal teaching use only. Questions © Hong Kong Examinations and Assessment Authority. 2016 is available in Chinese only. Pre-2016-curriculum and HKEAA-deleted questions are excluded.",timeUp:"Time is up!",home:"🏠 Home",gateH:"Sign in to start practising",gateP:"Use your school Google account (@fss.edu.hk). Your results and wrong questions are saved to your account, so you can continue on any device.",signOut:"Sign out",saving:"Saving…",saved:"✓ Saved",needSign:"Sign in again to save",badDom:"Please sign in with your school account (@fss.edu.hk).",saveIn:"Your result is saved to your school account.",saveWait:"Saving your result…",saveFail:"Your result could not be saved yet. It is kept on this device and will be sent next time you sign in.",paperH:"Paper",p1:"Paper 1A (Compulsory)",p2:"Paper 2 (Electives)",selAll:"Select all",selNone:"Clear all",zoom:"Tap the question to enlarge",
     topicsN:{heat:"Heat",mech:"Mechanics",wave:"Waves",em:"Electricity & Magnetism",nuc:"Radioactivity & Nuclear Energy",astro:"Astronomy & Space Science",atom:"Atomic World",energy:"Energy & Use of Energy",med:"Medical Physics"}},
  C:{title:"DSE 物理 多項選擇題練習",subtitle:"香港中學文憑試 歷屆多項選擇題 — 卷一甲（2012–2025）及卷二選修部分（2012–2025）— 按年份或課題練習",
     years:"年份",topics:"課題",ext:"延伸部分題目 (*)",extOn:"包括 * 題目",extHint:"標有 * 的題目涉及延伸部分（甲類學生毋須作答）。",
     howMany:"題目數量",all:"全部",order:"次序",random:"隨機",paper:"按試卷次序",mode:"模式",
     practice:"練習",exam:"考試",practiceHint:"每題作答後即時顯示答案。",examHint:"計時（每題 1.8 分鐘，與正式考試相同），完成後才顯示答案。",
     start:"開始",pool:n=>`共有 ${n} 題符合你的選擇`,myWrong:"我的錯題",
     wrongInfo:n=>n?`你之前答錯了 ${n} 題（已儲存在你的帳戶）。`:"暫時未有錯題紀錄。",
     redoSaved:"練習錯題",clear:"清除",prev:"← 上一題",next:"下一題 →",finish:"完成",flag:"⚐ 標記",unflag:"⚑ 已標記",myFlag:"⚑ 我的標記題目",flagInfo:n=>n?`你已標記 ${n} 題，留待稍後溫習（已儲存在你的帳戶）。`:"暫時未有標記題目。做題時按「⚐ 標記」即可把題目儲存到這裏。",flagStart:"練習這些題目",flagList:"顯示題目",flagHide:"隱藏題目",unflagQ:"移除",flagRedo:"標記題目重温 – ",quit:"離開",
     q:(i,n)=>`第 ${i} 題（共 ${n} 題）`,correctFb:"✓ 答對了！",wrongFb:k=>`✗ 答案是 ${k}。`,pct:p=>`（${p}% 考生答對）`,
     confirmFinish:n=>`尚有 ${n} 題未作答，確定完成？`,confirmQuit:"確定離開？你的答案將不會保留。",
     result:"成績",scoreSub:(c,n,t)=>`${n} 題中答對 ${c} 題${t?` · 用時 ${t}`:""}`,topic:"課題",correct:"答對",
     newSet:"重新選題",redo:n=>`重做 ${n} 道錯題`,review:"題目檢討",onlyWrong:"只顯示答錯／未答",
     yours:"你的答案",key:"答案",none:"—",paperQ:q=>q.P===2?`${q.y} DSE 卷二 第 ${q.q} 題`:`${q.y} DSE 第 ${q.n} 題`,
     footer:"只供校內教學用途。試題版權屬香港考試及評核局所有。已剔除超出現行課程及考評局刪除的題目。",timeUp:"時間到！",home:"🏠 主頁",gateH:"請先登入再開始練習",gateP:"請使用學校 Google 帳戶（@fss.edu.hk）登入。你的成績和錯題會儲存在帳戶中，可在任何裝置繼續練習。",signOut:"登出",saving:"儲存中…",saved:"✓ 已儲存",needSign:"請重新登入以儲存",badDom:"請使用學校帳戶（@fss.edu.hk）登入。",saveIn:"你的成績已儲存到學校帳戶。",saveWait:"正在儲存你的成績…",saveFail:"成績暫時未能儲存，已保留在此裝置，下次登入時會自動上傳。",paperH:"試卷",p1:"卷一甲（必修部分）",p2:"卷二（選修部分）",selAll:"全選",selNone:"全部取消",zoom:"點擊題目可放大",
     topicsN:{heat:"熱學",mech:"力學",wave:"波動學",em:"電與磁",nuc:"放射性及核能",astro:"天文學和航天科學",atom:"原子世界",energy:"能量及能源的使用",med:"醫學物理學"}}
};
const TOPICS1=["heat","mech","wave","em","nuc"], TOPICS2=["astro","atom","energy","med"], TOPICS=[...TOPICS1,...TOPICS2];
let paper="1";
const ofPaper=q=>String(q.P||1)===paper;
let Q=[], lang="E", S=null, timerId=null;
const $=id=>document.getElementById(id);
const store={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const qid=q=>q.P===2?`${q.y}-P2-${q.q.replace(".","-")}`:`${q.y}-${String(q.n).padStart(2,"0")}`;
const img=q=>q.P===2?`img/${q.y}-P2${"ABCD"[+q.q[0]-1]}-${q.l||lang}-${q.q[2]}.png`:`img/${q.y}-${q.l||lang}-${String(q.n).padStart(2,"0")}.png`;
const cOnly=q=>q.l==="C"&&lang==="E"?`<span class="tag ext">中文 only</span>`:"";

function chip(label,val,pressed,onclick){const b=document.createElement("button");b.className="chip";b.textContent=label;b.dataset.v=val;b.setAttribute("aria-pressed",pressed);b.onclick=onclick||(()=>{toggle(b);refresh()});return b}
function setAll(id,v){[...$(id).children].forEach(c=>c.setAttribute("aria-pressed",v));refresh()}
function toggle(b){b.setAttribute("aria-pressed",b.getAttribute("aria-pressed")!=="true")}
function radio(container,b){[...container.children].forEach(c=>c.setAttribute("aria-pressed",c===b));refresh()}
const on=id=>[...$(id).children].filter(c=>c.getAttribute("aria-pressed")==="true").map(c=>c.dataset.v);

function buildSetup(){
  const t=T[lang];
  const pc=$("paperChips"); pc.replaceChildren(...[["1",t.p1],["2",t.p2]].map(([v,l])=>{const b=chip(l,v,v===paper);b.onclick=()=>{if(paper!==v){paper=v;$("yearChips").replaceChildren();$("topicChips").replaceChildren();$("numChips").replaceChildren();buildSetup()}};return b}));
  const years=[...new Set(Q.filter(ofPaper).map(q=>q.y))].sort((a,b)=>b-a);
  $("extRow").classList.toggle("hidden",paper==="2");
  const keep=(id,def)=>{const prev=$(id).children.length?on(id):null;return v=>prev?prev.includes(String(v)):def(v)};
  const ky=keep("yearChips",()=>true), kt=keep("topicChips",()=>true), kn=keep("numChips",v=>v===(paper==="2"?"8":"10")), ko=keep("orderChips",v=>v==="random"), km=keep("modeChips",v=>v==="practice");
  $("yearChips").replaceChildren(...years.map(y=>chip(y,y,ky(y))));
  $("topicChips").replaceChildren(...(paper==="2"?TOPICS2:TOPICS1).map(k=>chip(t.topicsN[k],k,kt(k))));
  const nc=$("numChips"); nc.replaceChildren(...(paper==="2"?["8","16","all"]:["10","20","33","all"]).map(v=>{const b=chip(v==="all"?t.all:v,v,kn(v));b.onclick=()=>radio(nc,b);return b}));
  const oc=$("orderChips"); oc.replaceChildren(...[["random",t.random],["paper",t.paper]].map(([v,l])=>{const b=chip(l,v,ko(v));b.onclick=()=>radio(oc,b);return b}));
  const mc=$("modeChips"); mc.replaceChildren(...[["practice",t.practice],["exam",t.exam]].map(([v,l])=>{const b=chip(l,v,km(v));b.onclick=()=>radio(mc,b);return b}));
  refresh();
}
const ACC={url:"https://script.google.com/macros/s/AKfycbyv8mayIPdC2R_k1h_llZz-hTZH_vmmZZH8POqccqxb7b_Su0ZfPKh4Dl1Nc9I1vzGTwQ/exec",cid:"91817011001-fj9tks7hkvk934to417krblgg3lv9k2q.apps.googleusercontent.com",dom:"fss.edu.hk"};
let user=null,tok=null,tokExp=0,accSt="",accMsg="";
const WK=()=>"dsemc_wrong_"+(user?user.email:"");
const PK=()=>"dsemc_pending_"+(user?user.email:"");
const FK=()=>"dsemc_flag_"+(user?user.email:"");
async function api(body){const r=await fetch(ACC.url,{method:"POST",body:JSON.stringify(body)});return r.json()}
function jwt(t){try{const b=t.split(".")[1].replace(/-/g,"+").replace(/_/g,"/");return JSON.parse(decodeURIComponent([...atob(b)].map(c=>"%"+c.charCodeAt(0).toString(16).padStart(2,"0")).join("")))}catch(e){return{}}}
const esc=x=>String(x).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[c]);
function gsiReady(){return window.google&&google.accounts&&google.accounts.id}
function showGate(){
  ["setup","quiz","results"].forEach(id=>$(id).classList.add("hidden"));$("gate").classList.remove("hidden");syncHome();
  const e=$("gateErr");e.textContent=accSt==="bad"?T[lang].badDom:"";e.classList.toggle("hidden",accSt!=="bad");
  if(gsiReady())google.accounts.id.renderButton($("gsiBtn"),{type:"standard",size:"large",shape:"pill",text:"signin_with",locale:lang==="C"?"zh-HK":"en"});
}
function setAcc(st,msg){
  accSt=st||"";accMsg=msg||"";const t=T[lang],a=$("acct");
  if(!user){a.innerHTML="";showGate();return}
  const s2={sync:["",t.saving],ok:["ok",t.saved],expired:["err",t.needSign],err:["err","⚠ "+accMsg]}[accSt]||["",""];
  a.innerHTML=`<span>👤 <b>${esc(user.name)}</b></span>${s2[1]?`<span class="st ${s2[0]}">${esc(s2[1])}</span>`:""}<button class="btn ghost small" onclick="signOut()">${esc(t.signOut)}</button>`;
  const si=$("saveInfo");if(si)si.textContent=accSt==="ok"?t.saveIn:accSt==="sync"?t.saveWait:accSt?t.saveFail:"";
}
function pend(){return store.get(PK(),{a:[],w:false})}
async function flush(){
  const p=pend();if(!p.a.length&&!p.w)return true;
  if(!tok||Date.now()>tokExp-60000)return false;
  do{const d=await api({action:"save",token:tok,attempt:p.a[0]||null,wrong:store.get(WK(),[]),flagged:store.get(FK(),[])});if(!d.ok)throw new Error(d.error||"error");
    p.a.shift();p.w=false;store.set(PK(),p)}while(p.a.length);
  return true;
}
async function sync(attempt){
  if(!user)return;const p=pend();if(attempt)p.a.push(attempt);p.w=true;store.set(PK(),p);setAcc("sync");
  try{if(await flush())setAcc("ok");else{setAcc("expired");try{google.accounts.id.prompt()}catch(e){}}}catch(e){setAcc("err",e.message)}
}
async function onCred(r){
  const p=jwt(r.credential);
  if(String(p.hd||"").toLowerCase()!==ACC.dom){user=null;tok=null;setAcc("bad");return}
  const first=!user;
  tok=r.credential;tokExp=(p.exp||0)*1000;user={email:String(p.email).toLowerCase(),name:p.name||p.email};store.set("dsemc_acct",1);
  $("gate").classList.add("hidden");if(first)showSetup();setAcc("sync");
  try{await flush();const d=await api({action:"load",token:tok});if(!d.ok)throw new Error(d.error||"error");
    if(Array.isArray(d.wrong))store.set(WK(),d.wrong);if(Array.isArray(d.flagged))store.set(FK(),d.flagged);setAcc("ok")}catch(e){setAcc("err",e.message)}
  if(!$("setup").classList.contains("hidden"))refresh();
}
function signOut(){clearInterval(timerId);S=null;user=null;tok=null;store.set("dsemc_acct",0);try{google.accounts.id.disableAutoSelect()}catch(e){}setAcc()}
function gsiInit(){
  if(gsiInit.done||!gsiReady())return;gsiInit.done=1;
  google.accounts.id.initialize({client_id:ACC.cid,callback:onCred,auto_select:true,hd:ACC.dom});
  if(!user)showGate();if(store.get("dsemc_acct",0))google.accounts.id.prompt();
}
function pool(){
  const ys=on("yearChips").map(Number), ts=on("topicChips"), ext=$("extChip").getAttribute("aria-pressed")==="true";
  return Q.filter(q=>ofPaper(q)&&ys.includes(q.y)&&ts.includes(q.t)&&(paper==="2"||ext||!q.x));
}
function refresh(){
  const t=T[lang], n=pool().length;
  $("poolInfo").textContent=t.pool(n); $("startBtn").disabled=!n;
  $("modeHint").textContent=on("modeChips")[0]==="exam"?t.examHint:t.practiceHint;
  const w=store.get(WK(),[]); $("wrongInfo").textContent=t.wrongInfo(w.length); $("wrongBtn").disabled=!w.length;
  const f=store.get(FK(),[]).filter(id=>ALLID().has(id)); $("flagInfo").textContent=t.flagInfo(f.length); $("flagStartBtn").disabled=$("flagListBtn").disabled=!f.length; if(!f.length)$("flagList").classList.add("hidden"); $("flagListBtn").textContent=$("flagList").classList.contains("hidden")?t.flagList:t.flagHide; if(!$("flagList").classList.contains("hidden"))renderFlagList();
}
function applyLang(){
  const t=T[lang]; document.documentElement.lang=lang==="C"?"zh-Hant":"en";
  document.querySelectorAll("[data-t]").forEach(e=>e.textContent=t[e.dataset.t]);
  $("lgE").className=lang==="E"?"on":""; $("lgC").className=lang==="C"?"on":"";
  $("extChip").textContent=t.extOn; $("startBtn").textContent=t.start; $("wrongBtn").textContent=t.redoSaved; $("flagStartBtn").textContent=t.flagStart;
  $("prevBtn").textContent=t.prev; $("homeBtn").textContent=t.home; $("onlyWrongChip").textContent=t.onlyWrong;
}
function setLang(l){lang=l;store.set("dsemc_lang",l);applyLang();setAcc(accSt,accMsg);if(!user)return;buildSetup();if(S){if(!$("quiz").classList.contains("hidden"))renderQ();if(!$("results").classList.contains("hidden"))renderResults()}}

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function start(list,redo){
  let qs=list||pool();
  const order=list?"random":on("orderChips")[0], num=list?"all":on("numChips")[0];
  if(order==="random")shuffle(qs=[...qs]); else qs=[...qs].sort((a,b)=>a.y-b.y||(a.P||1)-(b.P||1)||(a.q||"").localeCompare(b.q||"")||a.n-b.n);
  if(num!=="all")qs=qs.slice(0,+num);
  const mode=list?"practice":on("modeChips")[0];
  S={qs,src:redo||(list?"redo":"setup"),ans:Array(qs.length).fill(null),flag:qs.map(q=>flagSet().has(qid(q))),i:0,mode,t0:Date.now(),limit:mode==="exam"?Math.round(qs.length*1.8*60):0};
  $("setup").classList.add("hidden");$("results").classList.add("hidden");$("quiz").classList.remove("hidden");syncHome();
  clearInterval(timerId);
  if(S.limit){$("timerBox").classList.remove("hidden");tick();timerId=setInterval(tick,1000)}else $("timerBox").classList.add("hidden");
  renderQ(); scrollTo(0,0);
}
let _all=null;const ALLID=()=>_all||(_all=new Set(Q.map(qid)));
function flagSet(){return new Set(store.get(FK(),[]))}
function setFlag(id,on){const f=flagSet();on?f.add(id):f.delete(id);store.set(FK(),[...f]);sync(null)}
function startFlag(){const f=flagSet();start(Q.filter(q=>f.has(qid(q))),"flag")}
function clearFlag(){if(!flagSet().size||!confirm(lang==="C"?"確定清除所有標記題目？":"Remove all flagged questions?"))return;store.set(FK(),[]);sync(null);refresh()}
function showFlagList(){$("flagList").classList.toggle("hidden");refresh()}
function renderFlagList(){const t=T[lang],f=flagSet();
  $("flagList").innerHTML=Q.filter(q=>f.has(qid(q))).sort((a,b)=>(a.P||1)-(b.P||1)||b.y-a.y||(a.q||"").localeCompare(b.q||"")||a.n-b.n).map(q=>`<div class="rev"><div><span class="tag">${t.topicsN[q.t]}</span>${cOnly(q)}<b>${t.paperQ(q)}</b> <button class="btn ghost small" style="float:right" onclick="setFlag('${qid(q)}',false);refresh()">${t.unflagQ}</button></div><img class="qimg" src="${img(q)}" alt="" loading="lazy"></div>`).join("")}
function startWrong(){const w=new Set(store.get(WK(),[]));start(Q.filter(q=>w.has(qid(q))))}
function clearWrong(){store.set(WK(),[]);sync(null);refresh()}
const fmt=s=>`${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`;
function tick(){const left=S.limit-Math.floor((Date.now()-S.t0)/1000);$("timer").textContent=fmt(Math.max(0,left));$("timer").classList.toggle("low",left<120);if(left<=0){clearInterval(timerId);alert(T[lang].timeUp);finish(true)}}

function renderQ(){
  const t=T[lang], q=S.qs[S.i], a=S.ans[S.i], n=S.qs.length, reveal=S.mode==="practice"&&a;
  $("qPos").textContent=t.q(S.i+1,n);
  $("qTags").innerHTML=`<span class="tag">${t.topicsN[q.t]}</span>`+(q.x?`<span class="tag ext">*</span>`:"")+cOnly(q)+`<span style="font-size:.85rem">${t.paperQ(q)}</span>`;
  $("progBar").style.width=`${100*S.ans.filter(Boolean).length/n}%`;
  $("qImg").src=img(q); $("qLink").href=img(q); $("qImg").alt=t.paperQ(q);
  $("opts").replaceChildren(...["A","B","C","D"].map(L=>{const b=document.createElement("button");b.className="opt";b.textContent=L;
    if(reveal){if(L===q.a)b.classList.add("right");else if(L===a)b.classList.add("wrong")}else if(L===a)b.classList.add("sel");
    b.onclick=()=>choose(L);return b}));
  const fb=$("fb");
  if(reveal){fb.classList.remove("hidden");const ok=a===q.a;fb.className="feedback "+(ok?"ok":"no");fb.textContent=(ok?t.correctFb:t.wrongFb(q.a))+(q.p?t.pct(q.p):"")}else fb.classList.add("hidden");
  $("prevBtn").disabled=S.i===0;
  $("nextBtn").textContent=S.i===n-1?t.finish:t.next;
  $("flagBtn").textContent=S.flag[S.i]?t.unflag:t.flag;$("flagBtn").classList.toggle("on",!!S.flag[S.i]);
  $("dots").replaceChildren(...S.qs.map((_,k)=>{const d=document.createElement("button");d.className="dot";d.textContent=k+1;
    if(S.ans[k])d.classList.add("ans");if(k===S.i)d.classList.add("cur");if(S.flag[k])d.classList.add("flag");
    if(S.mode==="practice"&&S.ans[k]){d.style.background=S.ans[k]===S.qs[k].a?"var(--good-soft)":"var(--bad-soft)";d.style.borderColor=S.ans[k]===S.qs[k].a?"var(--good)":"var(--bad)";d.style.color=d.style.borderColor}
    d.onclick=()=>{S.i=k;renderQ()};return d}));
}
function choose(L){if(S.mode==="practice"&&S.ans[S.i])return;S.ans[S.i]=L;renderQ()}
function flag(){S.flag[S.i]=!S.flag[S.i];setFlag(qid(S.qs[S.i]),S.flag[S.i]);renderQ()}
function flagRev(k){S.flag[k]=!S.flag[k];setFlag(qid(S.qs[k]),S.flag[k]);renderReview()}
function go(d){if(S.i+d>=S.qs.length){const left=S.ans.filter(x=>!x).length;if(left&&!confirm(T[lang].confirmFinish(left)))return;finish();return}S.i=Math.max(0,S.i+d);renderQ();scrollTo(0,0)}
function quit(){if(confirm(T[lang].confirmQuit)){clearInterval(timerId);S=null;showSetup()}}
function finish(){
  clearInterval(timerId); S.used=Math.floor((Date.now()-S.t0)/1000);
  const w=new Set(store.get(WK(),[]));
  S.qs.forEach((q,k)=>{if(S.ans[k]===q.a)w.delete(qid(q));else w.add(qid(q))});
  store.set(WK(),[...w]);
  const yrs=[...new Set(S.qs.map(q=>q.y))].sort();
  sync({part:(S.src==="redo"?"Wrong-question redo – ":S.src==="flag"?"Flagged review – ":"")+(S.qs[0]&&S.qs[0].P===2?"Paper 2":"Paper 1A")+` (${yrs.length>3?yrs[0]+"–"+yrs[yrs.length-1]:yrs.join(", ")})`,
    topics:TOPICS.filter(k=>S.qs.some(q=>q.t===k)).map(k=>T.E.topicsN[k]),mode:S.mode,total:S.qs.length,
    correct:S.qs.filter((q,k)=>S.ans[k]===q.a).length,seconds:S.used,wrongIds:S.qs.filter((q,k)=>S.ans[k]!==q.a).map(qid)});
  $("quiz").classList.add("hidden");$("results").classList.remove("hidden");syncHome();renderResults();scrollTo(0,0);
}
function renderResults(){
  const t=T[lang], n=S.qs.length, c=S.qs.filter((q,k)=>S.ans[k]===q.a).length;
  $("score").textContent=`${Math.round(100*c/n)}%`;
  $("scoreSub").textContent=t.scoreSub(c,n,fmt(S.used));
  $("topicTable").innerHTML=TOPICS.map(k=>{const qs=S.qs.map((q,i)=>[q,i]).filter(([q])=>q.t===k);if(!qs.length)return"";
    const ok=qs.filter(([q,i])=>S.ans[i]===q.a).length,p=Math.round(100*ok/qs.length);
    return `<tr><td>${t.topicsN[k]}</td><td>${ok} / ${qs.length}</td><td style="width:35%"><div class="bar"><i style="width:${p}%"></i></div></td></tr>`}).join("");
  const wrong=S.qs.filter((q,k)=>S.ans[k]!==q.a).length;
  $("redoBtn").textContent=t.redo(wrong);$("redoBtn").classList.toggle("hidden",!wrong);
  renderReview();
}
function renderReview(){
  const t=T[lang], only=$("onlyWrongChip").getAttribute("aria-pressed")==="true";
  $("reviewList").innerHTML=S.qs.map((q,k)=>{const a=S.ans[k],ok=a===q.a;if(only&&ok)return"";
    return `<div class="rev"><div><span class="tag">${t.topicsN[q.t]}</span>${q.x?'<span class="tag ext">*</span>':""}${cOnly(q)}<b>${t.paperQ(q)}</b> <button class="btn ghost small" style="float:right" onclick="flagRev(${k})">${S.flag[k]?t.unflag:t.flag}</button></div>
      <img class="qimg" src="${img(q)}" alt="" loading="lazy">
      <div>${t.yours}: <span class="${ok?"ok":"no"}">${a||t.none}</span> &nbsp; ${t.key}: <span class="ok">${q.a}</span>${q.p?`<span class="hint">${t.pct(q.p)}</span>`:""}</div></div>`}).join("");
}
function redoWrong(){start(S.qs.filter((q,k)=>S.ans[k]!==q.a))}
function goHome(){if(!$("quiz").classList.contains("hidden"))quit();else showSetup()}
function syncHome(){$("homeBtn").classList.toggle("hidden",!user||$("quiz").classList.contains("hidden")&&$("results").classList.contains("hidden"))}
function showSetup(){if(!user){showGate();return}$("quiz").classList.add("hidden");$("results").classList.add("hidden");$("setup").classList.remove("hidden");syncHome();refresh();scrollTo(0,0)}
document.addEventListener("keydown",e=>{if(!S||$("quiz").classList.contains("hidden"))return;const k=e.key.toUpperCase();
  if("ABCD".includes(k)&&k.length===1)choose(k);else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft"&&S.i>0)go(-1)});

lang=store.get("dsemc_lang","E");
fetch("questions.json").then(r=>r.json()).then(d=>{Q=d;applyLang();buildSetup();setAcc();gsiInit()});
</script>
<script src="https://accounts.google.com/gsi/client" async defer onload="gsiInit()"></script>
